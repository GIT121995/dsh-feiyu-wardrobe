<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>大肥鱼衣橱 · 换装间</title>
<meta name="description" content="陪大肥鱼换衣服、一起过日子：2.5D 动态角色（WebGL2），自由搭配、切换 Q版/少女版、换背景和特效——开源免费。">
<meta name="theme-color" content="#f6ecff">
<!-- v3.0.1 首屏资产版本（与 app.js RUNTIME_2D5_ASSET_VERSION 一致；供 head 内提前 preload 用） -->
<meta name="feiyu-asset-version" content="26">
<style>
  /* v3.0.1 首屏加载态：静态标记 + 内联样式，脚本/外部 CSS 就绪前即可见（暗色舞台风格） */
  #figureLoading {
    position: absolute; inset: 0; z-index: 19;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 11px; padding: 24px 18px; text-align: center;
    color: rgba(255, 255, 255, .94); pointer-events: none;
    background:
      radial-gradient(58% 44% at 50% 48%, rgba(40, 27, 78, .5), rgba(20, 14, 42, .12) 70%, transparent 100%);
    transition: opacity .26s ease;
  }
  #figureLoading[hidden] { display: none !important; }
  #figureLoading.fl-hidden { opacity: 0; }
  #figureLoading .fl-spinner {
    width: 34px; height: 34px; border-radius: 50%;
    border: 3px solid rgba(255, 255, 255, .18); border-top-color: #c9b8ff;
    box-shadow: 0 0 20px rgba(165, 139, 255, .35);
    animation: feiyu-fl-spin .9s linear infinite;
  }
  @keyframes feiyu-fl-spin { to { transform: rotate(360deg); } }
  #figureLoading .fl-text {
    margin: 0; font-size: 12.5px; font-weight: 700; letter-spacing: .02em;
    color: rgba(255, 255, 255, .92); text-shadow: 0 1px 6px rgba(0, 0, 0, .45);
  }
  #figureLoading .fl-bar {
    width: min(178px, 66%); height: 4px; border-radius: 999px;
    background: rgba(255, 255, 255, .18); overflow: hidden;
  }
  #figureLoading .fl-fill {
    width: 6%; height: 100%; border-radius: 999px;
    background: linear-gradient(90deg, #a58bff, #6fc8ff);
    box-shadow: 0 0 10px rgba(165, 139, 255, .5);
    transition: width .3s ease;
  }
  #figureLoading .fl-pct {
    font-size: 10.5px; color: rgba(255, 255, 255, .62);
    font-variant-numeric: tabular-nums; letter-spacing: .06em;
  }
  @media (max-width: 820px) {
    #figureLoading { gap: 9px; padding: 18px 14px; }
    #figureLoading .fl-spinner { width: 30px; height: 30px; border-width: 2.5px; }
    #figureLoading .fl-text { font-size: 12px; }
  }
  @media (prefers-reduced-motion: reduce) {
    #figureLoading { transition: none; }
    #figureLoading .fl-spinner { animation: none; }
    #figureLoading .fl-fill { transition: none; }
  }
</style>
<script>
/* v3.0.1 首屏：记录启动/FCP 时间 + 按「即将加载的 shape 与 tier」尽早 preload rig/图集。
   资产版本来自上面的 meta（与 app.js 常量一致，node test 守住一致性）；URL 用 searchParams
   拼接（不写字面量 ?v=），避免与页面模块 ?v=<page> 的版本门禁混淆。 */
(() => {
  'use strict';
  window.__feiyuBootStart = performance.now();
  try {
    if (typeof PerformanceObserver === 'function') {
      new PerformanceObserver((list) => {
        for (const entry of list.getEntries()) {
          if (entry.name === 'first-contentful-paint' && !window.__feiyuFcpAt) window.__feiyuFcpAt = entry.startTime;
        }
      }).observe({ type: 'paint', buffered: true });
    }
  } catch (error) { /* ignore */ }
  function shapeForPreload() {
    try {
      const params = new URLSearchParams(location.search);
      const fromUrl = String(params.get('shape') || '').trim();
      if (fromUrl === 'chibi' || fromUrl === 'girl') return fromUrl;
      const saved = JSON.parse(localStorage.getItem('feiyu:outfit') || 'null');
      if (saved && (saved.shape === 'chibi' || saved.shape === 'girl')) return saved.shape;
    } catch (error) { /* 隐私模式/存储禁用时忽略 */ }
    return 'chibi';
  }
  function tierForPreload() {
    try {
      const params = new URLSearchParams(location.search);
      const fromUrl = String(params.get('feiyuTier') || '').trim().toLowerCase();
      if (fromUrl === 'lo' || fromUrl === 'hi') return fromUrl;
      const stored = String(localStorage.getItem('feiyu:tier') || '').trim().toLowerCase();
      if (stored === 'lo' || stored === 'hi') return stored;
    } catch (error) { /* ignore */ }
    return 'auto';
  }
  try {
    const meta = document.querySelector('meta[name="feiyu-asset-version"]');
    const assetVersion = meta && meta.content ? String(meta.content).trim() : '';
    if (!/^\d+$/.test(assetVersion)) return;
    const shape = shapeForPreload();
    const forcedTier = tierForPreload();
    // v3.2.0 lazy outfit page：首屏只加载 base 页（+ 运行时按当前套装补拉套装页），
    // 所以 preload 只覆盖 rig.bin + base 页图集；套装页由 runtime 的懒加载/后台预取负责。
    // 默认（auto）= lo 首帧路径；显式 ?feiyuTier=hi 固定 hi 时 preload hi 的 rig.bin + base 页。
    const hi = forcedTier === 'hi';
    const files = ['rig.bin', 'atlas.webp'];
    const head = document.head || document.documentElement;
    for (const file of files) {
      const url = new URL('art/2d5/' + shape + (hi ? '-hi/' : '/') + file, location.href);
      url.searchParams.set('v', assetVersion);
      const link = document.createElement('link');
      link.rel = 'preload';
      link.href = url.href;
      if (file.startsWith('rig.')) {
        link.as = 'fetch';
        link.crossOrigin = 'anonymous';
        link.setAttribute('fetchpriority', 'high');
      } else {
        link.as = 'image';
        // 图集是首帧关键路径（lo 1.25MB / hi 3.05MB+0.53MB）：与 rig 同优先级尽早开始下载，
        // 与运行时 `new Image()` 请求共用 preload 条目（不会重复下载）
        link.setAttribute('fetchpriority', 'high');
      }
      head.appendChild(link);
    }
  } catch (error) { /* preload 失败不影响正常加载 */ }
})();
</script>
<link rel="stylesheet" href="style.css?v=29">
</head>
<body>
<main class="app">
  <section class="stage" id="stage" aria-label="换装舞台">
    <img class="scene" id="scene" src="art/bg-snow.webp" alt="" decoding="async">
    <div class="scene-veil"></div>

    <div class="figure-wrap" id="figureWrap" role="button" tabindex="0" aria-label="大肥鱼，点一下说话">
      <div class="figure-shadow" id="figureShadow"></div>
      <div class="fallback-notice" id="fallbackNotice" hidden>
        <p class="fallback-title">换装间需要 WebGL2</p>
        <p class="fallback-desc">当前浏览器/设备不支持 WebGL2。请升级浏览器，或在浏览器设置中开启硬件加速（GPU 渲染）后重试。</p>
        <button id="retryBtn" class="btn" type="button">重试</button>
      </div>
      <div class="diy-static-note" id="diyNote" hidden>DIY 造型为静态，不支持骨骼动画</div>
    </div>

    <!-- v3.0.1 首屏加载态：进入 figure 区立即可见，runtime 首帧后平滑移除；失败时隐藏并显示 fallbackNotice -->
    <div class="figure-loading" id="figureLoading" data-feiyu-loading role="status" aria-live="polite" aria-label="正在加载换装角色">
      <div class="fl-spinner" aria-hidden="true"></div>
      <p class="fl-text" id="figureLoadingText">正在加载角色…</p>
      <div class="fl-bar" aria-hidden="true"><div class="fl-fill" id="figureLoadingFill"></div></div>
      <span class="fl-pct" id="figureLoadingPct" aria-hidden="true"></span>
    </div>

    <canvas class="fx" id="fx" aria-hidden="true"></canvas>
    <div class="bubble" id="bubble" role="status" aria-live="polite" hidden></div>
    <div class="stage-tip" id="stageTip">点一下 · 陪她说说话</div>
    <div class="stage-credit">立绘 / 服装：Seedream 生成 · 角色参考：大肥鱼社区二创 · 非官方 · 禁止商用</div>
    <div class="interaction-hud" id="interactionHud" hidden>
      <div class="ihud-row"><span class="ihud-key">心情</span><span id="moodHud" class="ihud-val">—</span><span id="moodFace" class="ihud-emoji">🐳</span></div>
      <div class="ihud-row"><span class="ihud-key">亲密度</span><span id="affinityHud" class="ihud-val">—</span></div>
      <div class="ihud-row"><span class="ihud-key">鱼粮</span><span id="coinsHud" class="ihud-val">—</span></div>
      <div class="ihud-actions">
        <button id="patBtn" class="btn small" type="button" aria-label="摸摸头">🫳 摸摸头</button>
        <button id="feedSmallBtn" class="btn small" type="button" aria-label="喂小鱼干（3 鱼粮）">🍚 鱼粮×3</button>
        <button id="feedBigBtn" class="btn small" type="button" aria-label="喂大餐（8 鱼粮）">🍱 鱼粮×8</button>
      </div>
      <div class="ihud-note" id="interactionNote" role="status" hidden></div>
      <div class="ihud-local" id="interactionLocal" hidden>本地模式 · 不消耗鱼粮</div>
    </div>

    <header class="brand-bar">
      <div class="brand">🐋 <b>大肥鱼衣橱</b> <span class="tag">换装间</span></div>
      <a class="icon-btn" href="https://github.com/GIT121995/dsh-feiyu-wardrobe" target="_blank" rel="noopener" title="GitHub" aria-label="GitHub">⭐</a>
    </header>
  </section>

  <aside class="wardrobe" aria-label="衣柜">
    <div class="wardrobe-head">
      <div class="shape-toggle" id="shapeToggle" role="group" aria-label="身形切换"></div>
      <div class="head-tools">
        <button id="diyBtn" class="icon-btn light" type="button" title="DIY 上传（默认关闭）" aria-label="DIY 上传">✨</button>
        <button id="collectBtn" class="icon-btn light" type="button" title="图鉴" aria-label="图鉴">📖</button>
      </div>
    </div>
    <div class="tabs" id="tabs" role="tablist" aria-label="衣柜分类"></div>
    <div class="grid" id="shelf" role="tabpanel"></div>
    <div class="wardrobe-foot">
      <div class="meta"><span id="lookName">经典女仆装</span><span id="lookDesc">Q版 · 冬夜街道 · 飘雪</span></div>
      <div class="btns">
        <button id="randomBtn" class="btn" type="button">🎲 随机</button>
        <button id="saveBtn" class="btn primary" type="button">📸 立绘卡</button>
      </div>
    </div>
  </aside>

  <div class="sheet diy-sheet" id="diySheet" hidden>
    <div class="sheet-card diy-card">
      <div class="sheet-head">
        <b>✨ DIY 上传 · 本地衣柜</b>
        <button id="diyClose" class="icon-btn light" type="button" aria-label="关闭 DIY 面板">✕</button>
      </div>
      <div id="diyBody" class="diy-body"></div>
    </div>
  </div>

  <div class="sheet" id="sheet" hidden>
    <div class="sheet-card">
      <div class="sheet-head"><b>📖 图鉴</b><button id="sheetClose" class="icon-btn light" type="button" aria-label="关闭">✕</button></div>
      <p id="sheetStat" class="sheet-stat"></p>
      <div id="sheetBody" class="sheet-body"></div>
    </div>
  </div>
</main>
<canvas id="exportCanvas" width="900" height="1350" hidden></canvas>
<script type="module" src="app.js?v=29"></script>
</body>
</html>
