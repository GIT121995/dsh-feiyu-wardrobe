# Bundle patch for dsh-feiyu-wardrobe.
# Values below are the defaults; omit any key to keep the built-in default.
- insert:
    - id: feiyu-wardrobe
      name: dsh-feiyu-wardrobe
      inject:
        - commands
      config:
        # Display name of your fish. /fish rename also works at runtime.
        fishName: 大肥鱼
        # Empty string means <DSH home>/feiyu-wardrobe/state.json
        statePath: ""
        timezoneOffsetMinutes: 480
        # 1 CNY of token spend = 100 fish-food coins by default.
        coinPerCNY: 100
        # Coins granted when the fish is born (so the first outfit is reachable).
        birthGiftCoins: 120
        # Keep the daily ledger for this many days (used by streak/report).
        dailyRetentionDays: 120
        # Statutory holidays (Asia/Shanghai dates, YYYY-MM-DD): off-peak pricing.
        holidays: []
        # ── 换装间（v2：2.5D-only）────────────────────────────────────────────
        # 2.5D 是唯一渲染路径（需浏览器支持 WebGL2；不支持时换装间显示文本提示）。
        # 互动/喂食经济开关（M5）：false = 端点 404、页面 local-only（只播台词/动作，不扣鱼粮）。
        dressUp:
          interaction:
            enabled: true
        # ── DIY 上传（可选 · 默认关闭）────────────────────────────────────────
        # 开启后换装间会出现「✨ DIY 上传」：把用户上传的衣服图 + 素体发给云端图像 API
        # （火山方舟 Seedream）生成 look/flat-color-out，再在浏览器本地自动成层进本地衣柜。
        # 隐私/费用：key 只从宿主环境读（ARK_API_KEY，或 ~/.config/seedream/env）；每日有图片/金额上限；
        # 详细契约见 docs/dress-up/DIY-UPLOAD.md。默认 false = 完全离线、零网络调用。
        diy:
          enabled: false
          # model: doubao-seedream-5-0-flash-260915   # 默认值；pro 未开通
          # size: 1152x2048
          # dailyImageLimit: 40        # 每日图片张数上限（一张 ¥0.21–0.30）
          # dailyBudgetYuan: 10        # 每日金额上限（¥）
          # pricePerImageYuan: 0.3     # 预估单价（保守）
          # retries: 2                 # 单张失败重试上限（≤2）
          # apiKeyFile: ""             # 自定义 ARK_API_KEY 环境文件（空=~/.config/seedream/env）
          # statePath / costLogPath / cacheDir / baseRefPath: 高级覆盖（默认 <DSH home>/feiyu-wardrobe/diy/）
